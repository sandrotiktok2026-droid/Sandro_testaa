<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <title>sandro_testaa | Achadinhos e reviews</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f10;
      --card: #1f2024;
      --line: #fff;
      --text: #fff;
      --mute: #a4a4ad;
      --accent: #ffe600;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; justify-content: center;
    }
    main { width: 100%; max-width: 480px; padding: 28px 18px 42px; text-align: center; }
    .avatar {
      width: 112px; height: 112px; margin: 12px auto 0; border: 3px solid var(--line);
      border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(145deg, #303039, #17171b); color: var(--accent);
      font-size: 42px; font-weight: 700; letter-spacing: -3px;
    }
    h1 { font-size: 1.65rem; font-weight: 600; margin: 16px 0 8px; }
    .subtitle { color: var(--mute); font-size: .95rem; margin: 0 0 18px; }
    .social { display: flex; justify-content: center; gap: 24px; margin: 0 0 28px; }
    .social a { width: 44px; height: 44px; display: grid; place-items: center; color: #fff; }
    .social svg { width: 32px; height: 32px; fill: currentColor; }
    .social a:focus-visible, .product:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .product {
      display: flex; align-items: center; gap: 14px; min-height: 98px; padding: 12px 16px;
      margin: 0 0 15px; border: 2px solid var(--line); border-radius: 22px;
      background: var(--card); color: var(--text); text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }
    .product:hover { background: #2a2b31; transform: translateY(-2px); }
    .product img {
      width: 72px; height: 72px; flex: 0 0 72px; object-fit: contain;
      border-radius: 14px; background: #fff;
    }
    .product-info { flex: 1; min-width: 0; text-align: left; }
    .product-info strong { display: block; font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .product-info span { display: block; margin-top: 5px; color: var(--mute); font-size: .82rem; }
    .arrow { color: var(--accent); font-size: 1.35rem; padding-left: 4px; }
    footer { color: #777780; font-size: .78rem; margin-top: 26px; }
  </style>
</head>
<body>
  <main>

    <p class="subtitle">Reviews, achadinhos e produtos que valem a pena.</p>

</html>
